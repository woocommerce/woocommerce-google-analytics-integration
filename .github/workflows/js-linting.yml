name: JavaScript Linting

on:
  workflow_call:

env:
  FORCE_COLOR: 2

jobs:
  JSLintingCheck:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare node
        uses: woocommerce/grow/prepare-node@46efe0b1b6f29cbd79ba37289fb89739420a42e7 # actions-v3.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Prepare annotation formatter
        uses: woocommerce/grow/eslint-annotation@46efe0b1b6f29cbd79ba37289fb89739420a42e7 # actions-v3.1.0

      - name: Lint JavaScript and annotate linting problems
        run: pnpm run lint:js --format ./eslintFormatter.cjs
