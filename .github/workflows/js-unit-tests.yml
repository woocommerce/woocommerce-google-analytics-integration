name: JavaScript Unit Tests

on:
  workflow_call:

env:
  FORCE_COLOR: 2

jobs:
  JSUnitTests:
    name: JavaScript Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare node
        uses: woocommerce/grow/prepare-node@9a5eac21da12c7fe3261724aab734dbe827170d8 # actions-v3.0.7
        with:
          node-version-file: ".nvmrc"

      # tests/js reads the redaction helper out of class-wc-google-gtag-js.php.
      # The coverage goes to the job summary. It only reports.
      - name: Run JavaScript unit tests
        shell: bash
        env:
          FORCE_COLOR: 0
        run: |
          npm run test:js:coverage | tee test-output.txt
          {
            echo "### JavaScript line coverage"
            echo
            echo "Lists only the source files the tests load."
            echo
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt | sed -e 's/^ℹ //' -e '/of coverage report/d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
