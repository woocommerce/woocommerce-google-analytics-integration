name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, auto_merge_enabled]
  schedule:
    - cron: '0 9 * * *'

permissions:
  pull-requests: write
  contents: write
  statuses: write

jobs:
  dependabot-auto-merge:
    uses: Automattic/dependabot-auto-merge-action/.github/workflows/dependabot-auto-merge.yml@4c5a1f301898cbdaf3a8a045ae2e0f7010cf7bc8 # v1.7.1
    permissions:
      pull-requests: write
      contents: write
      statuses: write
    with:
      event-name: ${{ github.event_name }}
      merge-method: 'merge'
    secrets:
      token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
