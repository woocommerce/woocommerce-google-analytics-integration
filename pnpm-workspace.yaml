engineStrict: true

# Security pins, moved from npm `overrides`. pnpm's `a>b` matches only a direct
# child, so pins npm scoped to a subtree are global here unless a global pin
# would also hit another major version.
overrides:
  '@babel/core': ^7.29.6
  '@babel/runtime': ^7.27.6
  markdown-it: ^14.3.3
  adm-zip: ^0.6.1
  webpack-dev-server: ^5.2.6
  lighthouse: ^13.4.1
  qs: ~6.16.1
  isomorphic-git: ^1.38.6
  uuid: 11.1.1
  minimatch: ^3.1.4
  '@typescript-eslint/typescript-estree>minimatch': ^9.0.7
  serialize-javascript: ^7.1.3
  'schema-utils>ajv': ^8.18.0

# Supply chain security: block packages published less than 24 hours ago.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@wordpress/*'
  - '@woocommerce/*'
  - '@automattic/*'

# Each of these ships prebuilt binaries or only prints a message on install.
allowBuilds:
  '@parcel/watcher': false
  core-js: false
  core-js-pure: false
  fs-ext-extra-prebuilt: false
  unrs-resolver: false
