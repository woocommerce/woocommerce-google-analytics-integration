name: JavaScript Unit Tests

on:
  push:
    branches:
      - trunk
    paths:
      - "**.js"
      - includes/class-wc-google-gtag-js.php
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/js-unit-tests.yml
  pull_request:
    paths:
      - "**.js"
      - includes/class-wc-google-gtag-js.php
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/js-unit-tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 2

jobs:
  JSUnitTests:
    name: JavaScript Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare node
        uses: woocommerce/grow/prepare-node@e981c25267d29c39ff6ab1ae4ea09b267efae86c # actions-v3.0.6
        with:
          node-version-file: ".nvmrc"

      # tests/js reads the redaction helper out of class-wc-google-gtag-js.php.
      - name: Run JavaScript unit tests
        run: npm run test:js
