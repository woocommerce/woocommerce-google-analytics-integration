name: Checks

# Runs the build, tests, linters and static analysis, and ends with “All checks”,
# the job the trunk ruleset requires.

on:
  pull_request:
  push:
    branches:
      - trunk
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

# The called workflows, such as build.yml, use ${{ github.workflow }}-${{ github.ref }},
# which would deadlock with this workflow.
concurrency:
  group: all-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      php: ${{ steps.filter.outputs.php }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for relevant changes
        id: filter
        # A manual run checks everything.
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            php:
              - .github/workflows/checks.yml
              - .github/workflows/php-unit-tests.yml
              - .github/workflows/php-coding-standards.yml
              - "**.php"
              - composer.json
              - composer.lock
              - package.json
              - package-lock.json
              - phpcs.xml.dist
              - phpunit.xml.dist
              - "bin/*.sh"
            js:
              - .github/workflows/checks.yml
              - .github/workflows/js-unit-tests.yml
              - .github/workflows/js-linting.yml
              - "**.js"
              - "**.mjs"
              - "**.cjs"
              - includes/class-wc-google-gtag-js.php
              - package.json
              - package-lock.json
              - .nvmrc

  # The job and called job names make “Build extension bundle / Build extension bundle”,
  # the check the Dependabot auto-merge ruleset requires.
  build:
    name: Build extension bundle
    if: github.event_name != 'push'
    uses: ./.github/workflows/build.yml

  plugin-check:
    name: WP.org Plugin Check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download extension bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: woocommerce-google-analytics-integration.zip

      - name: Unzip extension bundle
        run: unzip -q woocommerce-google-analytics-integration.zip

      - name: WP.org Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./woocommerce-google-analytics-integration
          # Keep results in annotations and the uploaded artifact, not a PR comment.
          repo-token: ''
          # The plugin name and slug are already published and cannot change.
          ignore-codes: |
            trademarked_term

  php-unit-tests:
    name: PHP unit tests
    needs: changes
    if: needs.changes.outputs.php != 'false'
    uses: ./.github/workflows/php-unit-tests.yml

  php-coding-standards:
    name: PHP coding standards
    needs: changes
    if: needs.changes.outputs.php != 'false'
    uses: ./.github/workflows/php-coding-standards.yml

  php-static-analysis:
    name: PHP static analysis
    uses: ./.github/workflows/php-static-analysis.yml

  js-unit-tests:
    name: JavaScript unit tests
    needs: changes
    if: needs.changes.outputs.js != 'false'
    uses: ./.github/workflows/js-unit-tests.yml

  js-linting:
    name: JavaScript linting
    needs: changes
    if: needs.changes.outputs.js != 'false'
    uses: ./.github/workflows/js-linting.yml

  # Runs on every pull request, like PHPStan: a new WordPress or WooCommerce
  # release can break it without a change here.
  e2e-tests:
    name: E2E tests
    uses: ./.github/workflows/e2e-tests.yml

  # The check the trunk ruleset requires. It fails when any job failed or was
  # cancelled, and passes when a job was skipped because its files did not
  # change. List every job of this workflow under needs.
  all-checks:
    name: All checks
    if: always()
    needs:
      - changes
      - build
      - plugin-check
      - php-unit-tests
      - php-coding-standards
      - php-static-analysis
      - js-unit-tests
      - js-linting
      - e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "::error::\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
          echo "All jobs passed."
