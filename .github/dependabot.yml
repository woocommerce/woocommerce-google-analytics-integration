version: 2
updates:
  # SHA-pinned Actions get no Dependabot security alerts, so these weekly
  # version-update PRs are how the pins stay current. Review each bump.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - 'dependencies'
