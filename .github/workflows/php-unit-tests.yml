name: PHP Unit Tests

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      php-version:
        description: 'PHP Version'
        default: '8.5'
      wp-rc-version:
        description: 'WordPress version for Release Candidate (ex. 6.5-RC3)'
        default: 'latest'
      wc-rc-version:
        description: 'WooCommerce version for Release Candidate (ex. 8.7.0-rc.1)'
        default: 'latest'

jobs:
  # checks.yml calls this workflow, also on its own manual runs, so tell a
  # manual run of this workflow apart by its php-version input.
  GetMatrix:
    if: inputs.php-version == ''
    name: Get WP and WC version Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wp-versions: ${{ steps.wp.outputs.versions }}
      wc-versions: ${{ steps.wc.outputs.versions }}
    steps:
      - name: Get Release versions from Wordpress
        id: wp
        uses: woocommerce/grow/get-plugin-releases@e981c25267d29c39ff6ab1ae4ea09b267efae86c # actions-v3.0.6
        with:
          slug: wordpress
          releases: 2
      - name: Get Release versions from WooCommerce
        id: wc
        uses: woocommerce/grow/get-plugin-releases@e981c25267d29c39ff6ab1ae4ea09b267efae86c # actions-v3.0.6
        with:
          source: github
          slug: woocommerce/woocommerce
          releases: 2
          includeRC: true # If an RC is upcoming, test it preferably.

  UnitTests:
    if: inputs.php-version == ''
    name: PHP unit tests - PHP ${{ matrix.php }}, WP ${{ matrix.wp-version || 'latest' }}, WC ${{ matrix.wc-versions || 'latest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: GetMatrix
    strategy:
      matrix:
        php: [8.5]
        wp-version: [latest]
        # Please note that wc-versions is a string containing versions separated by commas.
        # It will be split and loop within the run unit test step below to reduce the time spent.
        wc-versions: [ '${{ join(fromJson(needs.GetMatrix.outputs.wc-versions)) }}' ]
        include:
          - php: 7.4
            wp-version: ${{ fromJson(needs.GetMatrix.outputs.wp-versions)[1] }} # L-1 WP Version support
            wc-versions: ${{ fromJson(needs.GetMatrix.outputs.wc-versions)[1] }} # L-1 WC Version support
          - php: 8.2
            wp-version: latest
            wc-versions: latest
          - php: 8.3
            wp-version: latest
            wc-versions: latest
          - php: 8.4
            wp-version: latest
            wc-versions: latest
            coverage: pcov # Measured on one row only, it slows the run down

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare PHP
        uses: woocommerce/grow/prepare-php@e981c25267d29c39ff6ab1ae4ea09b267efae86c # actions-v3.0.6
        with:
          php-version: "${{ matrix.php }}"
          coverage: "${{ matrix.coverage || 'none' }}"

      - name: Lint PHP files for deprecations
        run: ./bin/lint-php-deprecations.sh

      - name: Set up MySQL
        uses: woocommerce/grow/prepare-mysql@e981c25267d29c39ff6ab1ae4ea09b267efae86c # actions-v3.0.6

      - name: Install svn (used for installing WP versions)
        run: sudo apt-get -y install subversion

      - name: Run PHP unit tests
        env:
          WP_VERSION: ${{ matrix.wp-version }}
          MATRIX_WC_VERSIONS: ${{ matrix.wc-versions }}
          COVERAGE: ${{ matrix.coverage }}
        run: |
          read -ra WC_VERSIONS <<< "$(echo "$MATRIX_WC_VERSIONS" | sed -r "s/ *, */ /g")"

          INIT_INSTALL=true

          for WC_VERSION in "${WC_VERSIONS[@]}"; do
            if [ "$INIT_INSTALL" = true ]; then
              echo "::group::Install WP ${WP_VERSION} and WC ${WC_VERSION}"
              ./bin/install-unit-tests.sh wordpress_test root root localhost "${WP_VERSION}" "${WC_VERSION}"
              INIT_INSTALL=false
            else
              echo "::group::Switch to WP ${WP_VERSION} and WC ${WC_VERSION}"
              ./bin/switch-wp-wc-in-unit-tests.sh wordpress_test root root localhost "${WP_VERSION}" "${WC_VERSION}"
            fi
            echo "::endgroup::"

            if [ -n "$COVERAGE" ]; then
              php -d pcov.directory="$GITHUB_WORKSPACE" -d pcov.exclude="~/(vendor|tests)/~" vendor/bin/phpunit --coverage-clover clover.xml
            else
              vendor/bin/phpunit
            fi
          done

      - name: List files without test coverage
        if: ${{ matrix.coverage }}
        run: node tests/bin/list-uncovered-files.js clover.xml "$GITHUB_WORKSPACE" >> "$GITHUB_STEP_SUMMARY"

  ReleaseCandidateUnitTests:
    if: inputs.php-version != ''
    name: PHP unit tests (for Release Candidates)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare PHP
        uses: woocommerce/grow/prepare-php@e981c25267d29c39ff6ab1ae4ea09b267efae86c # actions-v3.0.6
        with:
          php-version: "${{ inputs.php-version }}"

      - name: Lint PHP files for deprecations
        run: ./bin/lint-php-deprecations.sh

      - name: Prepare MySQL
        uses: woocommerce/grow/prepare-mysql@e981c25267d29c39ff6ab1ae4ea09b267efae86c # actions-v3.0.6

      - name: Install svn (used for installing WP versions)
        run: sudo apt-get -y install subversion

      - name: Install WP tests
        env:
          INPUT_WP_RC_VERSION: ${{ inputs.wp-rc-version }}
          INPUT_WC_RC_VERSION: ${{ inputs.wc-rc-version }}
        run: ./bin/install-unit-tests.sh wordpress_test root root localhost "${INPUT_WP_RC_VERSION}" "${INPUT_WC_RC_VERSION}"

      - name: Run PHP unit tests
        run: vendor/bin/phpunit
