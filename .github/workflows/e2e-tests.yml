name: E2E Tests

on:
  workflow_call:
    inputs:
      wc-rc-version:
        description: The WooCommerce version to test with. Empty for the latest.
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      wp-rc-version:
        description: 'WordPress version for Release Candidate (ex. 6.3-RC3)'
      wc-rc-version:
        description: 'WooCommerce version for Release Candidate (ex. 8.0.0-rc.1)'

jobs:
  E2ETests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_COLOR: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare PHP
        uses: woocommerce/grow/prepare-php@9a5eac21da12c7fe3261724aab734dbe827170d8 # actions-v3.0.7
        with:
          install-deps: "no"

      - name: Prepare node
        uses: woocommerce/grow/prepare-node@9a5eac21da12c7fe3261724aab734dbe827170d8 # actions-v3.0.7
        with:
          node-version-file: ".nvmrc"
          ignore-scripts: "no"

      - name: Build production bundle
        run: |
          echo "::group::Build log"
          npm run build
          echo "::endgroup::"

      - name: Start wp-env container
        id: wp-env-start
        env:
          WC_VERSION: ${{ inputs.wc-rc-version }}
        run: npm run wp-env:up

      - name: Install WP release candidate (optional)
        if: github.event.inputs.wp-rc-version != ''
        env:
          INPUT_WP_RC_VERSION: ${{ github.event.inputs.wp-rc-version }}
        run: |
          npm run -- wp-env run cli --config=.wp-env.test.json -- wp core update --version="${INPUT_WP_RC_VERSION}"
          npm run -- wp-env run cli --config=.wp-env.test.json -- wp core update-db

      - name: Download and install Chromium browser.
        run: npx playwright install chromium

      - name: Run tests
        run: npm run test:e2e

      # A test that passed only on retry still passes the job, so list it.
      - name: Report tests that passed only on retry
        if: ${{ !cancelled() }}
        run: node tests/e2e/bin/report-results.js tests/e2e/test-results/results.json

      - name: Check PHP debug log
        if: ${{ !cancelled() && steps.wp-env-start.outcome == 'success' }}
        run: npm run test:e2e:debug-log

      - name: Archive e2e failure screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
            # The weekly run calls this workflow once per WooCommerce version.
            name: e2e-screenshots${{ inputs.wc-rc-version && format('-{0}', inputs.wc-rc-version) || '' }}
            path: tests/e2e/test-results/report/**/*.png
            if-no-files-found: ignore
            retention-days: 5
