name: JavaScript Linting

on:
  push:
    branches:
      - trunk
    paths:
      - "**.js"
      - "**.mjs"
      - "**.cjs"
      - package.json
      - .github/workflows/js-linting.yml
  pull_request:
    paths:
      - "**.js"
      - "**.mjs"
      - "**.cjs"
      - package.json
      - .github/workflows/js-linting.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 2

jobs:
  JSLintingCheck:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare node
        uses: woocommerce/grow/prepare-node@e981c25267d29c39ff6ab1ae4ea09b267efae86c # actions-v3.0.6
        with:
          node-version-file: ".nvmrc"

      - name: Prepare annotation formatter
        uses: woocommerce/grow/eslint-annotation@e981c25267d29c39ff6ab1ae4ea09b267efae86c # actions-v3.0.6

      - name: Lint JavaScript and annotate linting problems
        run: npm run lint:js -- --format ./eslintFormatter.cjs
